version: '3.8'

services:
  # MinIO (Object Storage - S3 Compatible)
  minio:
    image: minio/minio
    container_name: media-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data

  # Create default buckets
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/uploads;
      /usr/bin/mc mb myminio/transcoded;
      /usr/bin/mc anonymous set download myminio/uploads;
      /usr/bin/mc anonymous set download myminio/transcoded;
      exit 0;
      "

  # Optional: Redis for Async Task Queue (if using Asynq)
  redis:
    image: redis:alpine
    container_name: media-redis
    ports:
      - '6379:6379'

  # Transcoding Service (FFmpeg Worker)
  # This acts as our "Cloudflare Stream" engine
  transcoder:
    image: jrottenberg/ffmpeg:5.1-alpine
    container_name: media-transcoder
    depends_on:
      - minio
    entrypoint: ['/app/transcoder-service']
    volumes:
      - ./service/transcoder/bin/transcoder-service:/app/transcoder-service
      - ./data/transcode-temp:/tmp/transcode
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    ports:
      - '8082:8082'
